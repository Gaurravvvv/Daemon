<style>
        /* Custom Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }

        /* Bloom/Glow Effect */
        .emerald-glow {
            filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.15));
        }

        /* Glitch Animation for initial load */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .glitch-load {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            animation-iteration-count: 2;
        }

        /* Particle styling */
        .pixel-particle {
            position: absolute;
            background-color: #10b981; /* primary-container */
            pointer-events: none;
            will-change: transform, opacity;
            transition: transform 1.5s cubic-bezier(0.19, 1, 0.22, 1), opacity 1.5s ease-out;
        }

        .hide-content {
            opacity: 0;
            transition: opacity 0.1s ease-out;
        }
    </style>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const wrapper = document.getElementById('content-wrapper');
            const container = document.getElementById('splash-container');
            
            // Configuration for particles
            const particleSize = 6;
            const delayBeforeDisintegration = 2000; // 2 seconds

            setTimeout(() => {
                // 1. Get dimensions of the content
                const rect = wrapper.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                
                // 2. Hide original content instantly
                wrapper.classList.add('hide-content');
                wrapper.style.visibility = 'hidden';

                // 3. Generate grid of particles over the area
                const cols = Math.floor(rect.width / particleSize);
                const rows = Math.floor(rect.height / particleSize);
                
                const particles = [];
                const fragmentContainer = document.createElement('div');
                fragmentContainer.style.position = 'absolute';
                fragmentContainer.style.top = `${rect.top}px`;
                fragmentContainer.style.left = `${rect.left}px`;
                fragmentContainer.style.width = `${rect.width}px`;
                fragmentContainer.style.height = `${rect.height}px`;
                fragmentContainer.style.pointerEvents = 'none';
                
                // Create particles
                // We don't create a perfect dense grid to keep performance up, 
                // just enough to look like the whole thing shattered.
                for (let i = 0; i < cols; i += 2) {
                    for (let j = 0; j < rows; j += 2) {
                        // Skip some to make it look organic
                        if (Math.random() > 0.6) continue;

                        const p = document.createElement('div');
                        p.className = 'pixel-particle';
                        p.style.width = `${particleSize}px`;
                        p.style.height = `${particleSize}px`;
                        p.style.left = `${i * particleSize}px`;
                        p.style.top = `${j * particleSize}px`;
                        
                        // Slightly vary color intensity
                        const opacity = 0.5 + Math.random() * 0.5;
                        p.style.opacity = opacity;

                        fragmentContainer.appendChild(p);
                        particles.push(p);
                    }
                }
                
                document.body.appendChild(fragmentContainer);

                // 4. Trigger animation next frame
                requestAnimationFrame(() => {
                    particles.forEach(p => {
                        // Random scatter vectors
                        const angle = Math.random() * Math.PI * 2;
                        const velocity = 50 + Math.random() * 300;
                        const tx = Math.cos(angle) * velocity;
                        const ty = Math.sin(angle) * velocity;
                        const rot = (Math.random() - 0.5) * 720;
                        const scale = Math.random() * 0.5; // shrink

                        p.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
                        p.style.opacity = '0';
                    });
                });

                // Cleanup after animation finishes
                setTimeout(() => {
                    fragmentContainer.remove();
                }, 1600);

            }, delayBeforeDisintegration);
        });
    </script>
